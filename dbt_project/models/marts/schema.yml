version: 2

models:
  - name: fct_daily_revenue
    description: Daily completed-order revenue for the CEO dashboard.
    columns:
      - name: order_date
        data_tests:
          - not_null
          # One row per day: the model GROUP BYs order_date, so a duplicate
          # here would mean the aggregation itself is broken (e.g. an extra
          # column silently leaked into the GROUP BY).
          - unique
      - name: daily_revenue
        data_tests:
          - not_null
      - name: completed_order_rows
        data_tests:
          - not_null
