unit_tests:
  # Baseline sanity: two completed orders for the same active customer should
  # sum to their combined amount, one row per order_date.
  - name: completed_orders_sum_to_expected_revenue
    model: fct_daily_revenue
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1, customer_id: C0001, amount_usd: 100.0, status: completed, order_date: '2026-08-01'}
          - {order_id: 2, customer_id: C0001, amount_usd: 70.0, status: completed, order_date: '2026-08-01'}
      - input: ref('stg_customers')
        rows:
          - {customer_id: C0001, is_active: true}
    expect:
      rows:
        - {order_date: '2026-08-01', completed_order_rows: 2, daily_revenue: 170.0}

  # Strong challenge: expose revenue inflation when the customer dimension has
  # two active rows for the same customer_id (a common SCD bug — e.g. a botched
  # backfill that forgot to close out the previous "current" row). The LEFT JOIN
  # in fct_daily_revenue fans one order row out into two, doubling both
  # completed_order_rows and daily_revenue for a single real order. A correct
  # model must de-duplicate the active-customer side of the join so exactly one
  # row per order survives.
  - name: duplicate_active_customer_row_does_not_inflate_revenue
    model: fct_daily_revenue
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1, customer_id: C0001, amount_usd: 100.0, status: completed, order_date: '2026-08-01'}
      - input: ref('stg_customers')
        rows:
          - {customer_id: C0001, is_active: true, tier: gold}
          - {customer_id: C0001, is_active: true, tier: gold}
    expect:
      rows:
        - {order_date: '2026-08-01', completed_order_rows: 1, daily_revenue: 100.0}
